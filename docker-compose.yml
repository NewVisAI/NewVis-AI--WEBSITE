# gensolve.in: website + Caddy (automatic HTTPS).
#   cp .env.example .env    # set ADMIN_KEY (and SMTP if you want lead emails)
#   docker compose up -d --build
services:
  website:
    build: .
    container_name: newvis-website
    restart: unless-stopped
    env_file: .env
    volumes:
      - website-leads:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on: [website]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  website-leads:
  caddy_data:
  caddy_config:
